name: secret check

on: push

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Verify APP_TOKEN is set
        shell: bash
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "APP_TOKEN is set (value hidden)."
          else
            echo "APP_TOKEN is not set."
            exit 1
          fi
