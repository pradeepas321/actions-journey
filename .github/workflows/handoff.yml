name: handoff

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create app.txt
        shell: bash
        run: |
          echo "built artifact for run ${{ github.run_number }}" > app.txt
          echo "--- app.txt ---"
          cat app.txt

      - name: Upload app-package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.txt

  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download app-package
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Verify app.txt exists
        shell: bash
        run: |
          ls -la
          test -f app.txt
          echo "app.txt present and verified."
