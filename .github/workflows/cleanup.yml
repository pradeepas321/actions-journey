name: cleanup

on: push

jobs:
  test-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Start test database
        shell: bash
        run: echo "Starting test database..."

      - name: Flaky check
        shell: bash
        run: |
          echo "Running flaky check..."
          exit 1

      - name: Stop test database
        if: always()
        shell: bash
        run: echo "Stopping test database..."
